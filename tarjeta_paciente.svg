<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para la tarjeta -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Tarjeta base -->
  <rect x="10" y="10" width="380" height="160" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>

  <!-- Franja superior decorativa -->
  <path d="M 10 26 Q 10 10 26 10 L 374 10 Q 390 10 390 26 L 390 35 L 10 35 Z" fill="#2563eb"/>

  <!-- Icono o avatar de mascota -->
  <circle cx="65" cy="95" r="32" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="65" y="103" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">🐾</text>

  <!-- Nombre del Paciente -->
  <text x="115" y="75" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">
    {Nombre}
  </text>

  <!-- Línea divisoria -->
  <line x1="115" y1="88" x2="360" y2="88" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>

  <!-- Campo: Raza -->
  <text x="115" y="115" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748b">
    RAZA:
  </text>
  <text x="165" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">
    {Raza}
  </text>

  <!-- Campo: Sexo -->
  <text x="115" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#64748b">
    SEXO:
  </text>
  <text x="165" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#334155">
    {Sexo}
  </text>
</svg>
